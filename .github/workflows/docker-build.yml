# ==============================================================
# GitHub Actions Workflow — Build & Push ke GHCR
# ==============================================================
# File ini otomatis dijalankan oleh GitHub setiap kali ada
# push ke branch 'main'.
#
# Alur kerja:
#   1. Checkout kode dari repo
#   2. Login ke GHCR (GitHub Container Registry)
#   3. Extract metadata (nama image, tag otomatis)
#   4. Build Docker image dari Dockerfile
#   5. Push image ke ghcr.io/USERNAME/app-relay:latest
#
# GITHUB_TOKEN: sudah tersedia otomatis di GitHub Actions,
#               tidak perlu buat secret manual!
# ==============================================================

name: Build & Push Docker Image

on:
  push:
    branches:
      - main          # Trigger otomatis saat push ke main
  workflow_dispatch:  # Bisa juga dijalankan manual dari tab Actions di GitHub

env:
  REGISTRY: ghcr.io
  # github.repository_owner → username GitHub Anda (otomatis, huruf kecil)
  # Nama image harus lowercase, sesuai dengan docker-compose.yml di server
  IMAGE_NAME: ${{ github.repository_owner }}/app-relay

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest

    # Izin yang dibutuhkan workflow ini:
    #   contents: read  → untuk checkout kode
    #   packages: write → untuk push image ke GHCR
    permissions:
      contents: read
      packages: write

    steps:
      # ===========================================================
      # STEP 1: Checkout kode
      # Mengunduh source code repo ke runner GitHub Actions
      # ===========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ===========================================================
      # STEP 2: Setup Docker Buildx
      # BuildKit adalah build engine modern Docker yang mendukung:
      #   - Cache layer (build lebih cepat berikutnya)
      #   - Multi-platform build (ARM, AMD64, dll)
      # ===========================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ===========================================================
      # STEP 3: Login ke GitHub Container Registry
      # GITHUB_TOKEN tersedia otomatis — tidak perlu setup secret!
      # Token ini memiliki scope "packages: write" karena kita set di atas
      # ===========================================================
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ===========================================================
      # STEP 4: Extract Docker Metadata
      # Action ini otomatis generate:
      #   - Tag 'latest' untuk branch main
      #   - Tag 'sha-xxxxxxx' berdasarkan commit SHA (traceable!)
      #   - Labels standar OCI (org.opencontainers.image.*)
      # ===========================================================
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      # ===========================================================
      # STEP 5: Build & Push Image
      # Menggunakan GitHub Actions Cache untuk cache Docker layers.
      # Build kedua dan seterusnya jauh lebih cepat karena
      # layer yang tidak berubah (terutama Maven deps) di-cache.
      # ===========================================================
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Simpan cache ke GitHub Actions Cache storage
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ===========================================================
      # STEP 6: Tampilkan info image yang berhasil di-push
      # ===========================================================
      - name: Summary
        run: |
          echo "### ✅ Image berhasil dipush ke GHCR!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull dengan:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
