# ==============================================================
# application-prod.properties — Konfigurasi Production
# ==============================================================
# File ini HANYA aktif saat profile "prod" digunakan.
# Profile diaktifkan via: -Dspring.profiles.active=prod
# (sudah dikonfigurasi di Dockerfile ENTRYPOINT)
#
# PENTING: Semua nilai sensitif dibaca dari ENVIRONMENT VARIABLES
# yang di-inject saat container dijalankan — BUKAN hardcoded!
#
# Sintaks: ${NAMA_ENV_VAR}         → wajib ada, error jika tidak ada
#          ${NAMA_ENV_VAR:default} → opsional, pakai default jika tidak ada
# ==============================================================

spring.application.name=relay

# ---------------------------------------------------------------
# SERVER
# ---------------------------------------------------------------
# Default 8080 jika SERVER_PORT tidak di-set
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------
# DATABASE — PostgreSQL
# ---------------------------------------------------------------
# Wajib di-set via environment variable di server
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Di production, hindari auto DDL — gunakan migration tool seperti Flyway/Liquibase
# validate: JPA hanya validasi schema, tidak mengubah apapun
spring.jpa.hibernate.ddl-auto=validate

# ---------------------------------------------------------------
# REDIS
# ---------------------------------------------------------------
# Default: service name "redis" jika dalam satu Docker network
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Connection pool
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=1

# ---------------------------------------------------------------
# JWT
# ---------------------------------------------------------------
relay.jwt-secret=${JWT_SECRET}
relay.jwt-expiration-in-day-access-token=${JWT_EXPIRY_DAYS:3}
relay.jwt-issuer=${JWT_ISSUER:relay}

# ---------------------------------------------------------------
# MISC
# ---------------------------------------------------------------
spring.mvc.hiddenmethod.filter.enabled=true

# Production: matikan semua output SQL (performa & keamanan)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
